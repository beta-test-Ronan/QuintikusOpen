<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Match v2 — RGB + Borda + Rotação</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Arial,sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:18px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:12px; margin-bottom:14px; }
  .grid { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  canvas { background:#fff; border-radius:6px; display:block; cursor:crosshair; max-width:100%; }
  button { background:#238636; color:#fff; border:0; padding:9px 16px; border-radius:8px;
           cursor:pointer; font-size:13px; font-weight:600; margin:3px 3px 0 0; }
  button:hover { background:#2ea043; }
  button.sec { background:#30363d; }
  button.sec:hover { background:#484f58; }
  button:disabled { background:#21262d; color:#8b949e; cursor:wait; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
         background:#21262d; color:#8b949e; margin-bottom:8px; }
  .label { font-size:12px; color:#8b949e; margin:8px 0 2px; }
  input[type=range] { width:100%; }
  input[type=file] { margin-top:6px; color:var(--fg); font-size:11px; max-width:280px; }
  .metric { font-family:ui-monospace,monospace; font-size:12px; line-height:1.6;
            background:#0d1117; padding:10px; border-radius:6px; margin-top:10px; white-space:pre-wrap; }
  .item { padding:5px 9px; border-left:3px solid #3fb950; margin-bottom:3px;
          background:#21262d; border-radius:4px; font-family:ui-monospace,monospace; font-size:11px; }
  #lista { max-height:280px; overflow-y:auto; margin-top:8px; }
  .hint { font-size:11px; color:#6e7681; margin-top:6px; line-height:1.5; }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; background:#21262d; color:#8b949e; font-size:10px; margin-right:3px; }
  .chk { font-size:12px; display:inline-block; margin-right:12px; }
  .profile { display:flex; gap:4px; margin:6px 0; }
  .profile button { padding:5px 10px; font-size:11px; }
  .profile button.active { background:#238636; }
  .profile button:not(.active) { background:#21262d; color:#8b949e; }
  .channels { font-size:11px; color:#8b949e; margin-top:4px; }
  .channels b { color:#58a6ff; }
</style>
</head>
<body>

<h1>🔎 Match v2 — Cinza + RGB + Borda + Rotação</h1>
<div class="sub">Pirâmide de resolução · NCC multi-canal · invariância a rotação e escala</div>

<div class="grid">
  <div class="card">
    <div class="tag">TELA</div>
    <canvas id="cvScreen" width="640" height="400"></canvas>
    <input type="file" id="fileScreen" accept="image/*">
    <div class="hint">💡 Clique e arraste para <b>definir o template</b>.</div>
  </div>

  <div class="card">
    <div class="tag">TEMPLATE</div>
    <canvas id="cvTemplate" width="90" height="90"></canvas>
    <div class="hint" id="tmplInfo">Nenhum template.</div>
    <input type="file" id="fileTemplate" accept="image/*">
  </div>

  <div class="card" style="min-width:340px; flex:1;">
    <div class="tag">CONTROLES</div>

    <div class="label">Perfil:</div>
    <div class="profile">
      <button data-profile="fast">⚡ Rápido</button>
      <button data-profile="balanced" class="active">⚖️ Balanceado</button>
      <button data-profile="high">🎯 Alta precisão</button>
    </div>

    <div class="label">Threshold: <b id="thVal">0.55</b></div>
    <input type="range" id="threshold" min="0.30" max="0.95" step="0.01" value="0.55">

    <div style="margin:8px 0;">
      <label class="chk"><input type="checkbox" id="multiscale" checked> Multi-escala</label>
      <label class="chk"><input type="checkbox" id="rotations"> Rotações (±20°, ±40°)</label>
      <label class="chk"><input type="checkbox" id="useEdge" checked> Borda (Sobel)</label>
      <label class="chk"><input type="checkbox" id="useRGB" checked> RGB</label>
    </div>

    <div>
      <button id="btnBuscar">▶ Buscar</button>
      <button id="btnDemo" class="sec">🎲 Demo</button>
      <button id="btnLimpar" class="sec">✕ Limpar</button>
    </div>

    <div class="metric" id="resumo">Aguardando…</div>
    <div id="lista"></div>
  </div>
</div>

<script>
/* ============================================================
   0. SETUP
   ============================================================ */
const cvS = document.getElementById('cvScreen');
const ctxS = cvS.getContext('2d', { willReadFrequently: true });
const cvT = document.getElementById('cvTemplate');
const ctxT = cvT.getContext('2d', { willReadFrequently: true });

let screenPack = null;   // { gray,R,G,B,edge, w,h, imgData }
let tmplPack   = null;   // { gray,R,G,B,edge, w,h }
let profile    = 'balanced';

const PROFILES = {
  fast:     { scales:[0.85, 1.0, 1.15], angles:[0],                    coarseStep:6, pyramid:false },
  balanced: { scales:[0.75, 0.9, 1.0, 1.1, 1.3], angles:[0, .35, -.35], coarseStep:4, pyramid:true },
  high:     { scales:[0.7, 0.85, 1.0, 1.15, 1.3], angles:[0, .35, -.35, .7, -.7], coarseStep:3, pyramid:true }
};

/* ============================================================
   1. UTILITÁRIOS DE CANAIS
   ============================================================ */
function toChannels(imgData) {
  const w = imgData.width, h = imgData.height;
  const d = imgData.data;
  const gray = new Float32Array(w*h);
  const R = new Float32Array(w*h);
  const G = new Float32Array(w*h);
  const B = new Float32Array(w*h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    R[p] = d[i]; G[p] = d[i+1]; B[p] = d[i+2];
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }
  const edge = sobel(gray, w, h);
  return { gray, R, G, B, edge, w, h, imgData };
}

function sobel(gray, w, h) {
  const out = new Float32Array(w*h);
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      const i = y*w + x;
      const gx = -gray[i-w-1] - 2*gray[i-1] - gray[i+w-1]
                 +gray[i-w+1] + 2*gray[i+1] + gray[i+w+1];
      const gy = -gray[i-w-1] - 2*gray[i-w] - gray[i-w+1]
                 +gray[i+w-1] + 2*gray[i+w] + gray[i+w+1];
      out[i] = Math.min(255, Math.hypot(gx, gy));
    }
  }
  return out;
}

/* ============================================================
   2. PIRÂMIDE — downsample por box filter
   ============================================================ */
function downsampleChannel(src, w, h, f) {
  const dw = Math.max(1, Math.floor(w/f));
  const dh = Math.max(1, Math.floor(h/f));
  const out = new Float32Array(dw*dh);
  for (let y = 0; y < dh; y++) {
    for (let x = 0; x < dw; x++) {
      let s = 0, c = 0;
      for (let dy = 0; dy < f; dy++) {
        for (let dx = 0; dx < f; dx++) {
          const sx = x*f+dx, sy = y*f+dy;
          if (sx < w && sy < h) { s += src[sy*w+sx]; c++; }
        }
      }
      out[y*dw+x] = s/c;
    }
  }
  return { data: out, w: dw, h: dh };
}

function pyramidLevel(pack, f) {
  if (f === 1) return pack;
  return {
    gray: downsampleChannel(pack.gray, pack.w, pack.h, f).data,
    R:    downsampleChannel(pack.R,    pack.w, pack.h, f).data,
    G:    downsampleChannel(pack.G,    pack.w, pack.h, f).data,
    B:    downsampleChannel(pack.B,    pack.w, pack.h, f).data,
    edge: downsampleChannel(pack.edge, pack.w, pack.h, f).data,
    w: Math.floor(pack.w/f),
    h: Math.floor(pack.h/f)
  };
}

/* ============================================================
   3. RESIZE / ROTAÇÃO DE TEMPLATE
   ============================================================ */
function bilinear(src, sw, sh, dw, dh) {
  const out = new Float32Array(dw*dh);
  const sx = sw/dw, sy = sh/dh;
  for (let y = 0; y < dh; y++) {
    for (let x = 0; x < dw; x++) {
      const fx = x*sx, fy = y*sy;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(sw-1, x0+1), y1 = Math.min(sh-1, y0+1);
      const wx = fx-x0, wy = fy-y0;
      out[y*dw+x] =
        src[y0*sw+x0]*(1-wx)*(1-wy) + src[y0*sw+x1]*wx*(1-wy) +
        src[y1*sw+x0]*(1-wx)*wy     + src[y1*sw+x1]*wx*wy;
    }
  }
  return out;
}

function rotateChannel(src, w, h, ang) {
  const out = new Float32Array(w*h);
  const cx = (w-1)/2, cy = (h-1)/2;
  const cos = Math.cos(ang), sin = Math.sin(ang);
  // valor médio para preencher cantos
  let mean = 0;
  for (let i = 0; i < src.length; i++) mean += src[i];
  mean /= src.length;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = x-cx, dy = y-cy;
      const sx =  cos*dx + sin*dy + cx;
      const sy = -sin*dx + cos*dy + cy;
      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      if (x0 < 0 || y0 < 0 || x0 >= w-1 || y0 >= h-1) { out[y*w+x] = mean; continue; }
      const fx = sx-x0, fy = sy-y0;
      out[y*w+x] =
        src[y0*w+x0]*(1-fx)*(1-fy) + src[y0*w+x0+1]*fx*(1-fy) +
        src[(y0+1)*w+x0]*(1-fx)*fy + src[(y0+1)*w+x0+1]*fx*fy;
    }
  }
  return out;
}

function makeVariant(tp, scale, angle) {
  const tw = Math.max(8, Math.round(tp.w * scale));
  const th = Math.max(8, Math.round(tp.h * scale));
  const scaleOne = Math.abs(scale-1) < 1e-3;
  const angleZero = Math.abs(angle) < 1e-6;
  const resize = (ch) => scaleOne ? ch.slice() : bilinear(ch, tp.w, tp.h, tw, th);
  const rot    = (ch) => angleZero ? ch : rotateChannel(ch, tw, th, angle);
  return {
    gray: rot(resize(tp.gray)),
    R:    rot(resize(tp.R)),
    G:    rot(resize(tp.G)),
    B:    rot(resize(tp.B)),
    edge: rot(resize(tp.edge)),
    w: tw, h: th, scale, angle
  };
}

/* ============================================================
   4. NCC — Normalized Cross Correlation (single channel)
   Retorna score em [-1, 1].
   ============================================================ */
function ncc(screen, sw, Tz, tw, th, ox, oy, n, Tm, Ts) {
  // Calcula média/desvio LOCAL da janela
  let s1 = 0, s2 = 0;
  for (let y = 0; y < th; y++) {
    const r = (oy+y)*sw + ox;
    for (let x = 0; x < tw; x++) {
      const v = screen[r+x];
      s1 += v; s2 += v*v;
    }
  }
  const Sm = s1/n;
  const varS = s2/n - Sm*Sm;
  if (varS < 2) return 0;   // janela quase uniforme → ignora
  const Ss = Math.sqrt(varS);

  let dot = 0;
  for (let y = 0; y < th; y++) {
    const rs = (oy+y)*sw + ox;
    const rt = y*tw;
    for (let x = 0; x < tw; x++) {
      dot += (screen[rs+x] - Sm) * Tz[rt+x];
    }
  }
  return dot / (n * Ss * Ts + 1e-9);
}

function tmplStats(T, n) {
  let m = 0;
  for (let i = 0; i < n; i++) m += T[i];
  m /= n;
  let v = 0;
  for (let i = 0; i < n; i++) { const d = T[i]-m; v += d*d; }
  v /= n;
  const s = Math.sqrt(v);
  const Tz = new Float32Array(n);
  for (let i = 0; i < n; i++) Tz[i] = T[i]-m;
  return { Tz, Tm:m, Ts:s, ok: s > 0.8 };
}

/* ============================================================
   5. MATCHING — coarse (cinza) → refine (cinza+borda)
   ============================================================ */
function searchChannel(screen, sw, sh, T, tw, th, thr, step, onlyCandidates) {
  const n = tw*th;
  const st = tmplStats(T, n);
  if (!st.ok) return [];
  const hits = [];
  if (sw < tw || sh < th) return hits;

  for (let oy = 0; oy + th <= sh; oy += step) {
    for (let ox = 0; ox + tw <= sw; ox += step) {
      const sc = ncc(screen, sw, st.Tz, tw, th, ox, oy, n, st.Tm, st.Ts);
      if (sc >= thr) hits.push({ x:ox, y:oy, score:sc });
    }
  }
  return hits;
}

function combinedScoreAt(sp, x, y, tvar, useEdge, useRGB, n) {
  const gTz = tmplStatsCache.get(tvar.gray) || setStats(tvar.gray, n);
  // gray sempre
  let sGray = ncc(sp.gray, sp.w, gTz.Tz, tvar.w, tvar.h, x, y, n, gTz.Tm, gTz.Ts);

  let sEdge = 0, wEdge = 0;
  if (useEdge) {
    const eTz = tmplStatsCache.get(tvar.edge) || setStats(tvar.edge, n);
    if (eTz.ok) { sEdge = ncc(sp.edge, sp.w, eTz.Tz, tvar.w, tvar.h, x, y, n, eTz.Tm, eTz.Ts); wEdge = 1; }
  }

  let sRGB = 0, wRGB = 0;
  if (useRGB) {
    const chans = [['R', tvar.R], ['G', tvar.G], ['B', tvar.B]];
    let acc = 0, cnt = 0;
    for (const [name, ch] of chans) {
      const tz = tmplStatsCache.get(ch) || setStats(ch, n);
      if (!tz.ok) continue;
      acc += ncc(sp[name], sp.w, tz.Tz, tvar.w, tvar.h, x, y, n, tz.Tm, tz.Ts);
      cnt++;
    }
    if (cnt) { sRGB = acc/cnt; wRGB = 1; }
  }

  const wG = 0.55, wE = useEdge ? 0.25 : 0, wC = useRGB ? 0.20 : 0;
  const wSum = wG + wE + wC;
  return (wG * sGray + wE * sEdge + wC * sRGB) / wSum;
}

// Cache de estatísticas do template (evita recalcular)
const tmplStatsCache = new Map();
function setStats(T, n) {
  const s = tmplStats(T, n);
  tmplStatsCache.set(T, s);
  return s;
}

/* ============================================================
   6. MATCHING PRINCIPAL
   ============================================================ */
function matchAll(profileCfg, threshold, useEdge, useRGB) {
  const hits = [];
  const PYR = profileCfg.pyramid ? 4 : 1;

  // -------- FASE 1 — COARSE em pirâmide --------
  const spCoarse = pyramidLevel(screenPack, PYR);
  const spCoarseCh = toChannelsFromPacks(spCoarse);

  // Gera todas as variantes uma vez
  const variants = [];
  for (const scale of profileCfg.scales) {
    for (const angle of profileCfg.angles) {
      if (scale === 1 && angle === 0) {
        variants.push({ v: tmplPack, scale:1, angle:0 });
        continue;
      }
      const v = makeVariant(tmplPack, scale, angle);
      variants.push({ v, scale, angle });
    }
  }

  // Coarse: só canal cinza, em pirâmide
  const coarsePerVariant = variants.map(({v, scale, angle}) => {
    const tw = Math.round(v.w / PYR), th = Math.round(v.h / PYR);
    if (tw < 6 || th < 6) return [];
    const T = PYR === 1 ? v.gray : downsampleChannel(v.gray, v.w, v.h, PYR).data;
    const cand = searchChannel(spCoarse.gray, spCoarse.w, spCoarse.h, T, tw, th,
                                threshold - 0.2, profileCfg.coarseStep);
    cand.sort((a, b) => b.score - a.score);
    return cand.slice(0, 25).map(c => ({
      x: Math.round(c.x * PYR), y: Math.round(c.y * PYR),
      scale, angle, v, coarseScore: c.score
    }));
  });

  // -------- FASE 2 — REFINE em tela cheia --------
  const n = (v) => v.w * v.h;
  const allCands = coarsePerVariant.flat();
  const localHits = [];

  for (const c of allCands) {
    const tw = c.v.w, th = c.v.h;
    const step = profileCfg.pyramid ? PYR : 2;

    // Refina ao redor do candidato grosseiro
    for (let dy = -step; dy <= step; dy += 1) {
      for (let dx = -step; dx <= step; dx += 1) {
        const x = c.x + dx, y = c.y + dy;
        if (x < 0 || y < 0 || x+tw > screenPack.w || y+th > screenPack.h) continue;
        const sc = combinedScoreAt(screenPack, x, y, c.v, useEdge, useRGB, n(c.v));
        if (sc >= threshold) {
          localHits.push({ x, y, w: tw, h: th, score: sc, scale: c.scale, angle: c.angle });
        }
      }
    }
  }

  return localHits;
}

// Helper: reconstrói canais completos a partir do objeto de pirâmide
function toChannelsFromPacks(p) {
  return { gray: p.gray, R: p.R, G: p.G, B: p.B, edge: p.edge, w: p.w, h: p.h };
}

/* ============================================================
   7. NMS — suprime caixas sobrepostas (e também entre ângulos)
   ============================================================ */
function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x+a.w, b.x+b.w);
  const y2 = Math.min(a.y+a.h, b.y+b.h);
  if (x2 <= x1 || y2 <= y1) return 0;
  const inter = (x2-x1)*(y2-y1);
  return inter / (a.w*a.h + b.w*b.h - inter);
}

function nms(hits, thr = 0.35) {
  hits.sort((a, b) => b.score - a.score);
  const kept = [];
  for (const h of hits) {
    if (!kept.some(k => iou(h, k) > thr)) kept.push(h);
  }
  return kept;
}

/* ============================================================
   8. DEMO — letras e ícones rotacionados
   ============================================================ */
const DEMO_CHARS = ['A','B','C','E','K','M','R','S','Z','★','●','▲','◆','♥','✚','Ω','☀','◐'];
const DEMO_COLORS = ['#d32f2f','#1976d2','#388e3c','#f57c00','#7b1fa2','#00838f','#000'];

function gerarDemo() {
  const W = cvS.width, H = cvS.height;
  ctxS.fillStyle = '#fff';
  ctxS.fillRect(0, 0, W, H);

  const cols = 8, rows = 5;
  const cw = W/cols, ch = H/rows;
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({r, c});
  for (let i = cells.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }

  const items = [];
  for (let i = 0; i < 22; i++) {
    const {r, c} = cells[i];
    const char = DEMO_CHARS[Math.floor(Math.random()*DEMO_CHARS.length)];
    const size = 22 + Math.floor(Math.random()*14);
    const x = c*cw + cw/2 + (Math.random()-0.5)*(cw*0.35);
    const y = r*ch + ch/2 + (Math.random()-0.5)*(ch*0.35);
    const color = DEMO_COLORS[Math.floor(Math.random()*DEMO_COLORS.length)];
    const rot = (Math.random()-0.5) * 0.9;   // ±26°

    ctxS.save();
    ctxS.translate(x, y);
    ctxS.rotate(rot);
    ctxS.font = `${size}px Arial`;
    ctxS.fillStyle = color;
    ctxS.textAlign = 'center';
    ctxS.textBaseline = 'middle';
    ctxS.fillText(char, 0, 0);
    ctxS.restore();
    items.push({ char, x, y, size, rot });
  }

  grabScreen();

  // Auto-seleciona o primeiro item (sem rotação para o template ficar "limpo")
  if (items.length) {
    const it = items[0];
    const half = Math.round(it.size * 0.85);
    selecionarTemplate(it.x - half, it.y - half, half*2, half*2, true);
    document.getElementById('tmplInfo').textContent =
      `Auto: "${it.char}" (${half*2}×${half*2}px)`;
  }
}

function grabScreen() {
  const id = ctxS.getImageData(0, 0, cvS.width, cvS.height);
  screenPack = toChannels(id);
}

function grabTemplate() {
  const id = ctxT.getImageData(0, 0, cvT.width, cvT.height);
  tmplPack = toChannels(id);
  tmplStatsCache.clear();
}

/* ============================================================
   9. SELEÇÃO DE TEMPLATE
   ============================================================ */
let selStart = null, selEnd = null, selecionando = false;

cvS.addEventListener('mousedown', e => {
  const r = cvS.getBoundingClientRect();
  const x = Math.round((e.clientX-r.left)*cvS.width/r.width);
  const y = Math.round((e.clientY-r.top)*cvS.height/r.height);
  selStart = {x, y}; selEnd = {x, y}; selecionando = true;
});

cvS.addEventListener('mousemove', e => {
  if (!selecionando) return;
  const r = cvS.getBoundingClientRect();
  selEnd = {
    x: Math.round((e.clientX-r.left)*cvS.width/r.width),
    y: Math.round((e.clientY-r.top)*cvS.height/r.height)
  };
  // Preview
  ctxS.putImageData(screenPack.imgData, 0, 0);
  const x = Math.min(selStart.x, selEnd.x), y = Math.min(selStart.y, selEnd.y);
  const w = Math.abs(selEnd.x-selStart.x), h = Math.abs(selEnd.y-selStart.y);
  ctxS.strokeStyle = '#58a6ff';
  ctxS.lineWidth = 1.5;
  ctxS.strokeRect(x+0.5, y+0.5, w, h);
});

cvS.addEventListener('mouseup', () => {
  if (!selecionando) return;
  selecionando = false;
  const x1 = Math.min(selStart.x, selEnd.x);
  const y1 = Math.min(selStart.y, selEnd.y);
  const x2 = Math.max(selStart.x, selEnd.x);
  const y2 = Math.max(selStart.y, selEnd.y);
  const w = x2-x1, h = y2-y1;
  if (w < 8 || h < 8) {
    const size = 44;
    const cx = Math.min(Math.max(selStart.x-size/2, 0), screenPack.w-size);
    const cy = Math.min(Math.max(selStart.y-size/2, 0), screenPack.h-size);
    selecionarTemplate(cx, cy, size, size);
  } else {
    selecionarTemplate(x1, y1, w, h);
  }
});

function selecionarTemplate(x, y, w, h, silencioso) {
  x = Math.max(0, Math.round(x)); y = Math.max(0, Math.round(y));
  w = Math.min(Math.round(w), screenPack.w-x);
  h = Math.min(Math.round(h), screenPack.h-y);
  if (w < 6 || h < 6) return;

  const sub = ctxS.getImageData(x, y, w, h);
  cvT.width = w; cvT.height = h;
  ctxT.putImageData(sub, 0, 0);
  grabTemplate();

  ctxS.putImageData(screenPack.imgData, 0, 0);
  ctxS.strokeStyle = '#58a6ff';
  ctxS.lineWidth = 2;
  ctxS.strokeRect(x+0.5, y+0.5, w, h);

  if (!silencioso) {
    document.getElementById('tmplInfo').textContent = `Template: ${w}×${h}px`;
  }
}

/* ============================================================
   10. BUSCA
   ============================================================ */
async function buscar() {
  if (!screenPack || !tmplPack) { alert('Carregue tela e template primeiro.'); return; }
  const btn = document.getElementById('btnBuscar');
  btn.disabled = true;
  btn.textContent = '🔍 Varrendo…';
  await new Promise(r => setTimeout(r, 30));

  const threshold = parseFloat(document.getElementById('threshold').value);
  const useEdge   = document.getElementById('useEdge').checked;
  const useRGB    = document.getElementById('useRGB').checked;
  const rot       = document.getElementById('rotations').checked;
  const multi     = document.getElementById('multiscale').checked;

  const cfg = JSON.parse(JSON.stringify(PROFILES[profile]));
  if (!multi) cfg.scales = [1.0];
  if (!rot)   cfg.angles = [0];

  const t0 = performance.now();
  const raw = matchAll(cfg, threshold, useEdge, useRGB);
  const kept = nms(raw, 0.35);
  const dt = performance.now() - t0;

  drawResults(kept);

  // Resumo
  const nCand = raw.length;
  document.getElementById('resumo').innerHTML = `\
<b>${kept.length}</b> ocorrência(s) · <b>${dt.toFixed(0)} ms</b>
<span class="badge">${cfg.scales.length} escalas</span>\
<span class="badge">${cfg.angles.length} ângulos</span>\
<span class="badge">${useEdge?'+borda':''}${useRGB?' +RGB':''}</span>
Template: ${tmplPack.w}×${tmplPack.h}px  ·  Tela: ${screenPack.w}×${screenPack.h}px
Candidatos brutos: ${nCand}  ·  Após NMS: ${kept.length}`;

  const lista = document.getElementById('lista');
  if (!kept.length) {
    lista.innerHTML = `<div class="hint">Nada acima do threshold. Baixe o slider.</div>`;
  } else {
    lista.innerHTML = kept.slice(0, 40).map((h, i) =>
      `<div class="item">
<b>#${i+1}</b> score <b>${(h.score*100).toFixed(1)}%</b> \
· escala ${h.scale.toFixed(2)} · ângulo ${(h.angle*180/Math.PI).toFixed(0)}°<br>
x=${h.x} y=${h.y} · ${h.w}×${h.h}
</div>`
    ).join('');
  }

  btn.disabled = false;
  btn.textContent = '▶ Buscar';
}

/* ============================================================
   11. DESENHO DOS RESULTADOS
   ============================================================ */
function drawResults(hits) {
  ctxS.putImageData(screenPack.imgData, 0, 0);
  hits.forEach((h, i) => {
    ctxS.strokeStyle = '#3fb950';
    ctxS.lineWidth = 2;
    ctxS.strokeRect(h.x+0.5, h.y+0.5, h.w, h.h);

    const label = `#${i+1} ${(h.score*100).toFixed(0)}%`;
    ctxS.font = 'bold 11px monospace';
    const tw = ctxS.measureText(label).width + 8;
    const ly = Math.max(14, h.y - 2);
    ctxS.fillStyle = 'rgba(63,185,80,0.95)';
    ctxS.fillRect(h.x, ly-14, tw, 14);
    ctxS.fillStyle = '#000';
    ctxS.fillText(label, h.x+4, ly-3);
  });
}

/* ============================================================
   12. EVENTOS
   ============================================================ */
document.getElementById('threshold').addEventListener('input', e =>
  document.getElementById('thVal').textContent = e.target.value);
document.getElementById('btnBuscar').addEventListener('click', buscar);
document.getElementById('btnDemo').addEventListener('click', () => { gerarDemo(); buscar(); });
document.getElementById('btnLimpar').addEventListener('click', () => {
  ctxS.fillStyle = '#fff';
  ctxS.fillRect(0, 0, cvS.width, cvS.height);
  grabScreen();
  ctxT.clearRect(0, 0, cvT.width, cvT.height);
  tmplPack = null;
  document.getElementById('tmplInfo').textContent = 'Nenhum template.';
  document.getElementById('resumo').textContent = 'Aguardando…';
  document.getElementById('lista').innerHTML = '';
});

document.querySelectorAll('[data-profile]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-profile]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    profile = btn.dataset.profile;
  });
});

document.getElementById('fileScreen').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(cvS.width/img.width, cvS.height/img.height, 1);
    cvS.width  = Math.round(img.width*sc);
    cvS.height = Math.round(img.height*sc);
    ctxS.drawImage(img, 0, 0, cvS.width, cvS.height);
    grabScreen();
    document.getElementById('resumo').textContent = `Tela carregada: ${cvS.width}×${cvS.height}`;
  };
  img.src = URL.createObjectURL(f);
});

document.getElementById('fileTemplate').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(cvT.width/img.width, cvT.height/img.height, 1);
    cvT.width  = Math.round(img.width*sc);
    cvT.height = Math.round(img.height*sc);
    ctxT.drawImage(img, 0, 0, cvT.width, cvT.height);
    grabTemplate();
    document.getElementById('tmplInfo').textContent = `Template: ${cvT.width}×${cvT.height}px`;
  };
  img.src = URL.createObjectURL(f);
});

window.addEventListener('load', () => { gerarDemo(); buscar(); });
</script>
