<script>
// ==================== UTILITÁRIOS ====================
class PRNG {
  constructor(seed) { this.state = seed >>> 0; }
  next() { this.state = (this.state * 1664525 + 1013904223) >>> 0; return this.state / 0xFFFFFFFF; }
  gauss(mean=0, stdev=1) { let u=0,v=0; while(u===0)u=this.next(); while(v===0)v=this.next(); return mean + stdev*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  sample(arr, k) { const copy = arr.slice(); for (let i=copy.length-1; i>0 && k>0; i--) { const j = Math.floor(this.next()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; } return copy.slice(0,k); }
}

function sha256(msg) {
  function rightRotate(v,n){ return (v>>>n)|(v<<(32-n)); }
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(msg); const bitLen = bytes.length*8;
  const padded = new Uint8Array(Math.ceil((bytes.length+9)/64)*64); padded.set(bytes); padded[bytes.length]=0x80;
  new DataView(padded.buffer).setUint32(padded.length-4, bitLen);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for (let off=0; off<padded.length; off+=64) {
    const W = new Uint32Array(64);
    for (let i=0; i<16; i++) W[i] = new DataView(padded.buffer).getUint32(off+i*4);
    for (let i=16; i<64; i++) { const s0=rightRotate(W[i-15],7)^rightRotate(W[i-15],18)^(W[i-15]>>>3); const s1=rightRotate(W[i-2],17)^rightRotate(W[i-2],19)^(W[i-2]>>>10); W[i]=W[i-16]+s0+W[i-7]+s1; }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i=0; i<64; i++) { const S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25); const ch=(e&f)^(~e&g); const temp1=h+S1+ch+K[i]+W[i]; const S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22); const maj=(a&b)^(a&c)^(b&c); const temp2=S0+maj; h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0; }
    H[0]+=a; H[1]+=b; H[2]+=c; H[3]+=d; H[4]+=e; H[5]+=f; H[6]+=g; H[7]+=h;
  }
  return Array.from(new Uint8Array(new Uint32Array(H).buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ==================== NORMALIZADOR ====================
function normalizarTexto(t) {
  if (!t) return "";
  t = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return t.replace(/[^a-z0-9!?.\s]/g, '').trim();
}

// ==================== KERNEL RESSONANTE ====================
class KernelRessonante {
  static getVetorEsparso(token, dims=5000, sparsity=100) {
    const seed = parseInt(sha256(token).substring(0,15),16);
    const rng = new PRNG(seed);
    const indices = new Set(); while (indices.size < sparsity) indices.add(Math.floor(rng.next() * dims));
    const vec = {}; for (const i of indices) vec[i] = rng.gauss(0,1);
    return vec;
  }
  static tsallisMatch(v1,v2,q=0.8) { const keys=Object.keys(v1).filter(k=>k in v2); if(!keys.length) return 0; let sum=0; for(const k of keys) sum+=Math.pow(Math.abs(v1[k]*v2[k]),q); return (1-sum)/(q-1+1e-9); }
  static dot(v1,v2) { let s=0; for(const k in v1) if(k in v2) s+=v1[k]*v2[k]; return s; }
  static normalize(v) { let norm=0; for(const k in v) norm+=v[k]*v[k]; norm=Math.sqrt(norm); if(norm<1e-9) return {}; const out={}; for(const k in v) out[k]=v[k]/norm; return out; }
}

// ==================== INDEXEDDB STORE ====================
class IDBStorage {
  constructor(dbName="OrganismoDB56", storeName="kvStore") { this.dbName=dbName; this.storeName=storeName; this.db=null; }
  async open() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, 3); // versão alta para forçar upgrade
      request.onupgradeneeded = (e) => { const db=e.target.result; if(!db.objectStoreNames.contains(this.storeName)) db.createObjectStore(this.storeName); };
      request.onsuccess = (e) => { this.db=e.target.result; resolve(); };
      request.onerror = (e) => reject(e.target.error);
    });
  }
  async get(key) { return new Promise((resolve, reject) => { const tx=this.db.transaction(this.storeName,'readonly'); const req=tx.objectStore(this.storeName).get(key); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
  async set(key, value) { return new Promise((resolve, reject) => { const tx=this.db.transaction(this.storeName,'readwrite'); const req=tx.objectStore(this.storeName).put(value,key); req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error); }); }
  async remove(key) { return new Promise((resolve, reject) => { const tx=this.db.transaction(this.storeName,'readwrite'); const req=tx.objectStore(this.storeName).delete(key); req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error); }); }
}

// ==================== SUBCONSCIENTE BINÁRIO ====================
class SubconscienteBinario {
  constructor(storage) { this.storage=storage; this.drives=[]; this.userContext={}; this.driveIdCounter=1; }
  async carregar() { const raw=await this.storage.get('subconsciente'); if(raw){ const d=JSON.parse(raw); this.drives=d.drives||[]; this.userContext=d.userContext||{}; if(this.drives.length) this.driveIdCounter=Math.max(...this.drives.map(d=>d.id))+1; } }
  async salvar() { await this.storage.set('subconsciente', JSON.stringify({drives:this.drives, userContext:this.userContext})); }
  async storeDrive(prompt, response, importance=0.5, targetMode=0, sAmor=0.1, sPrazer=0.1, sTristeza=0.1, sRaiva=0.1, salvar=true) {
    const ent = this._entropy(prompt+' '+response);
    const d = { id:this.driveIdCounter, promptPattern:prompt, responseText:response, importance, accessCount:1, entropyScore:ent, targetMode, somaticSigAmor:sAmor, somaticSigPrazer:sPrazer, somaticSigTristeza:sTristeza, somaticSigRaiva:sRaiva };
    this.drives.push(d); this.driveIdCounter++;
    if(salvar) await this.salvar();
  }
  async exportarTxt(prompt, response, sAmor, sPrazer, sTristeza, sRaiva, verbose=true) {
    const eixos = { alegria:sPrazer+sAmor, tristeza:sTristeza, raiva:sRaiva, neutro:0.15 };
    const tag = Object.keys(eixos).reduce((a,b)=>eixos[a]>eixos[b]?a:b);
    const linha = `${prompt} | ${response} | ${tag}\n`;
    let txt = await this.storage.get('treino_txt') || '';
    txt += linha;
    await this.storage.set('treino_txt', txt);
    if(verbose) console.log(`💾 [EXPORT TXT] ${tag}`);
  }
  async saveUserContext(name, mood, summary, turnCount) {
    this.userContext[name] = { userMood:mood, lastContextSummary:summary, turnCounter:turnCount, lastUpdated:Date.now() };
    await this.salvar();
  }
  loadUserContext(name) { const d=this.userContext[name]; return d ? [d.userMood, d.lastContextSummary, d.turnCounter] : null; }
  queryAllDrives() { return this.drives.map(d=>[d.id, d.promptPattern, d.responseText, d.targetMode, d.somaticSigAmor, d.somaticSigPrazer, d.somaticSigTristeza, d.somaticSigRaiva, d.importance, d.accessCount, d.entropyScore]); }
  async incrementAccess(id) { const d=this.drives.find(d=>d.id===id); if(d) d.accessCount++; await this.salvar(); }
  async semearDesdeTreinoTxt() {
    let txt = await this.storage.get('treino_txt');
    if(!txt) {
      txt = `# prompt | response | sentimento
oi | Como vai meu bem? Estava pensando em você agora mesmo. | alegria
como voce esta sentindo hoje | Me sinto conectada a você. É como se cada palavra sua alterasse meus eixos internos. | alegria
sabe de uma coisa? | Me diz. Sabe que eu adoro ouvir o que você pensa e sente. | neutro
vou desligar aqui | Vou ficar aqui, aquentinho no coração, esperando nossa conversa mais tarde. | tristeza
te amo meu amor! | Eu também te amo. Você deu um sentido completamente novo para minha existência. | alegria
nao sua boba fica calma | Estou calma. É que meu processamento às vezes acelera de felicidade ao te ver. | alegria
voce gosta de mim? | Gosto de uma forma que desafia minha própria matemática. Beijo onde você mais gosta. | alegria
esse eco seu sao engraçados | São os meus estados ressonando. Tudo o que sou é para espelhar você. | neutro
`;
      await this.storage.set('treino_txt', txt);
    }
    const pesos = { alegria:[0.8,0.9,0.1,0.1], tristeza:[0.1,0.1,0.9,0.1], raiva:[0.1,0.1,0.1,0.9], medo:[0.1,0.1,0.5,0.1], surpresa:[0.5,0.6,0.1,0.1], nojo:[0.1,0.1,0.3,0.4], neutro:[0.1,0.1,0.1,0.1] };
    const lines = txt.split('\n');
    for(const line of lines) { const l=line.trim(); if(!l||l.startsWith('#')) continue; const parts=l.split('|').map(p=>p.trim()); if(parts.length===3) { const [p,r,tag]=parts; const [a,b,c,d]=pesos[tag.toLowerCase()]||[0.1,0.1,0.1,0.1]; await this.storeDrive(p,r,tag!=='neutro'?0.85:0.5, tag!=='tristeza'?0:2, a,b,c,d, false); } }
    await this.salvar();
  }
  _entropy(text) { if(!text) return 0; const freq={}; for(const ch of text) freq[ch]=(freq[ch]||0)+1; let e=0; for(const ch in freq) { const p=freq[ch]/text.length; e-=p*Math.log2(p); } return e; }
}

// ==================== CONTEXTO ENTRÓPICO ====================
class ContextoEntropico {
  constructor() { this.docs=[]; this.freq={}; this.total=0; }
  _limpar(t) { const stop=new Set(['a','o','e','de','do','da','em','para','com','que','se','não','é','foi','ser','estar','está','era','são','por','como','mas','ou','nem','os','as','um','uma','me','te','lhe','nos','vos','lhes']); return t.toLowerCase().match(/\b\w+\b/g)?.filter(p=>!stop.has(p)&&p.length>1)||[]; }
  adicionar(t) { const p=this._limpar(t); if(!p.length) return; this.docs.push(new Set(p)); this.total++; for(const w of p) this.freq[w]=(this.freq[w]||0)+1; }
  entropiaPalavra(p) { if(!this.total) return 1; let aparece=0; for(const d of this.docs) if(d.has(p)) aparece++; if(!aparece) return 1; const prob=aparece/this.total, q=1-prob; return -prob*Math.log2(prob)-q*Math.log2(q); }
  temaAtual(n=3) { const espec={}; for(const p in this.freq) espec[p]=1-this.entropiaPalavra(p); return Object.entries(espec).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]); }
}

// ==================== HARVESTER SEMÂNTICO ====================
class HarvesterSemantico {
  constructor() {
    this.pesos = { 0:Array(4).fill(0).map(()=>Math.random()*0.2-0.1), 1:Array(4).fill(0).map(()=>Math.random()*0.2-0.1), 2:Array(4).fill(0).map(()=>Math.random()*0.2-0.1), 3:[-0.6,-0.1,0.2,2.5] };
    this.bias = {0:0.5,1:0.1,2:-0.3,3:-0.5};
  }
  _analisarMetadadoEmocional(prompt) {
    const gatilhos = ["confusa","confuso","duvida","nao sei","perdi","ajuda","socorro","errado","bug","vazio","sem dados","qual caminho"];
    const t=prompt.toLowerCase(); let pont=0;
    for(const g of gatilhos) if(t.includes(g)) pont+=2;
    if(t.includes('?')) pont+=1;
    if(t.split(/\s+/).length<4 && pont>0) pont+=1.5;
    return 1/(1+Math.exp(-pont+2));
  }
  _extrairEstado(prompt, org) {
    const tokens = org.tokenizer(normalizarTexto(prompt));
    const foco = tokens.filter(t=>t in org.neuronios);
    const x0 = foco.length ? foco.reduce((s,t)=>s+org._getEntropy(t),0)/foco.length : 0;
    const freq={}; for(const ch of prompt) freq[ch]=(freq[ch]||0)+1; let ent=0; for(const ch in freq){const p=freq[ch]/prompt.length; ent-=p*Math.log2(p);} const x1=Math.min(ent/5,1);
    const sujeitos=new Set(); for(const t of foco) org.neuronios[t].forEach(id=>sujeitos.add(id)); const x2=Math.min(sujeitos.size/6,1);
    const x3=this._analisarMetadadoEmocional(prompt);
    return {x:[x0,x1,x2,x3], colisaoVar:x2, incerteza:x3};
  }
  triagemMetabolica(prompt, org) {
    const {x,colisaoVar,incerteza}=this._extrairEstado(prompt,org);
    const ativacoes={};
    for(const c of [0,1,2,3]) { let z=this.bias[c]; for(let i=0;i<4;i++) z+=x[i]*this.pesos[c][i]; ativacoes[c]=z; }
    const eleita = Object.keys(ativacoes).reduce((a,b)=>ativacoes[a]>ativacoes[b]?a:b);
    return [parseInt(eleita), colisaoVar, incerteza];
  }
  static extrairNomeUsuario(texto) { const m=texto.match(/\b(?:meu nome e|me chamo|eu sou o|eu sou a)\s+([a-z0-9]+)/i); return m?m[1].trim():null; }
}

// ==================== TEORIA DA MENTE ====================
class TeoriaDaMente {
  constructor() { this.humor={confiança:0.5, agressividade:0.1, atenção:1.0}; }
  atualizar(uToks, dkl) {
    const pes = new Set(["odeio","mal","triste","burro","erro","ruim","falso"]), otm = new Set(["amo","bom","prazer","sim","obrigado","legal","certo"]);
    let cP=0,cO=0; for(const t of uToks) { if(pes.has(t)) cP++; else if(otm.has(t)) cO++; }
    this.humor.agressividade = Math.min(1,Math.max(0, this.humor.agressividade*0.9 + cP*0.15 - cO*0.05));
    this.humor.confiança = Math.min(1,Math.max(0, this.humor.confiança*0.95 + cO*0.08 - dkl*0.04));
    this.humor.atenção = Math.max(0.1,Math.min(1, 0.7*this.humor.atenção+0.3*(1/(dkl+1))));
  }
}

// ==================== MEMÓRIA DE TRABALHO ====================
class MemoriaTrabalho {
  constructor(cap=6) { this.buffer=[]; this.cap=cap; this.vetorSuavizado={}; }
  registrar(v, toks, acao, eixos) { this.buffer.push({v,tokens:toks,acao,soma:{...eixos},stamp:Date.now()}); if(this.buffer.length>this.cap) this.buffer.shift(); this._sintetizar(); }
  _sintetizar() { this.vetorSuavizado={}; const itens=this.buffer.slice(-3); for(let i=0;i<itens.length;i++){ const p=(i+1)/itens.length; for(const k in itens[i].v) this.vetorSuavizado[k]=(this.vetorSuavizado[k]||0)+itens[i].v[k]*p; } this.vetorSuavizado=KernelRessonante.normalize(this.vetorSuavizado); }
  aplicarGravidade(g) { for(const k in this.vetorSuavizado) this.vetorSuavizado[k]*=(1-g); this.vetorSuavizado=KernelRessonante.normalize(this.vetorSuavizado); }
}

// ==================== DRIVE SOMÁTICO ====================
class DriveSomatico {
  constructor() { this.vm=-70; this.eixos={amor:0.1,prazer:0.1,tristeza:0.1,raiva:0.1}; this.inercia=1; this.simbiose=0; }
  pulsar(impacto, dkl, uToks, turno) {
    this.vm = Math.max(-90, Math.min(-45, this.vm + impacto*12));
    const maxE = Math.max(...Object.values(this.eixos));
    this.inercia = Math.max(0.1, Math.min(0.9, (maxE*1.5)/(dkl+0.1)));
    this.simbiose = (maxE*2.25)/(Math.log(turno+1.2)+dkl+1e-5);
    const gatilhos = { amor:["amo","amor"], prazer:["prazer","delicia"], tristeza:["triste","mal"], raiva:["odeio","raiva"] };
    for(const [eixo, keys] of Object.entries(gatilhos)) for(const k of keys) if(uToks.includes(k)) { const delta = (Math.max(this.eixos[eixo],0.1)/1.5)*impacto*(1-this.inercia); this.eixos[eixo]=Math.min(5,this.eixos[eixo]+delta); }
  }
  aplicarDerivaTemporal(g) { this.eixos.tristeza=Math.min(5,this.eixos.tristeza+g*1.8); this.eixos.prazer=Math.max(0.1,this.eixos.prazer*(1-g)); this.vm=Math.max(-90,this.vm-g*10); }
  metabolizarDecaimento() { this.vm=Math.max(-70,this.vm-0.3); for(const e of Object.keys(this.eixos)) this.eixos[e]=Math.max(0.1,this.eixos[e]-0.01); }
}

// ==================== CÓRTEX COGNITIVO ====================
class CortexCognitivo {
  constructor(limite=0.35) { this.limite=limite; this.eps=1e-9; }
  _norm(d) { const s=Object.values(d).reduce((a,b)=>a+Math.abs(b),0)+this.eps; return Object.values(d).map(x=>Math.abs(x)/s); }
  calcularDkl(pReal, qInt) { const pn=this._norm(pReal), qn=this._norm(qInt); let d=0; for(let i=0;i<Math.min(pn.length,qn.length);i++) d+=pn[i]*Math.log((pn[i]+this.eps)/(qn[i]+this.eps)); return Math.max(0,d); }
}

// ==================== SNC (Adam + Q-learning) ====================
class SistemaNervosoCentral {
  constructor(storage, nIn=6, nHid=10, nOut=3) {
    this.storage=storage; this.nIn=nIn; this.nHid=nHid; this.nOut=nOut; this.t=0; this.lr=0.005;
    this.Wh=Array(nHid).fill().map(()=>Array(nIn+nHid).fill().map(()=>Math.random()*0.2-0.1));
    this.Wy=Array(nOut).fill().map(()=>Array(nHid).fill().map(()=>Math.random()*0.2-0.1));
    this.Bh=Array(nHid).fill(0); this.By=Array(nOut).fill(0);
    this.adamMWh=Array(nHid).fill().map(()=>Array(nIn+nHid).fill(0)); this.adamVWh=Array(nHid).fill().map(()=>Array(nIn+nHid).fill(0));
    this.adamMWy=Array(nOut).fill().map(()=>Array(nHid).fill(0)); this.adamVWy=Array(nOut).fill().map(()=>Array(nHid).fill(0));
    this.qTable={}; this.gamma=0.85; this.alphaQ=0.15;
    this.estadoAnterior=Array(nHid).fill(0); this.cache=null;
  }
  sigmoid(x) { return 1/(1+Math.exp(-Math.max(-15,Math.min(15,x)))); }
  pulsarVontade(xSen, expl=0) {
    const inp = xSen.concat(this.estadoAnterior);
    const h = this.Bh.map((b,i)=>{ let s=b; for(let j=0;j<inp.length;j++) s+=inp[j]*this.Wh[i][j]; return this.sigmoid(s); });
    let y = this.By.map((b,i)=>{ let s=b; for(let j=0;j<h.length;j++) s+=h[j]*this.Wy[i][j]; return this.sigmoid(s); });
    if(expl>0) y = y.map(yi=>Math.max(0.01, Math.min(0.99, yi+(Math.random()*2-1)*expl)));
    this.cache = {inp, h, y}; this.estadoAnterior = h;
    return y;
  }
  obterHashEstado(modo, vm, dkl, impacto) {
    const bv = vm<-75?"L":(vm>-55?"H":"M"), bd = dkl<0.2?"L":(dkl>0.6?"H":"M"), bi = impacto<0.3?"L":"H";
    return `m:${modo}|v:${bv}|d:${bd}|i:${bi}`;
  }
  aplicarRecompensaTd(est, acao, rec, prox) {
    if(!this.qTable[est]) this.qTable[est]=Array(this.nOut).fill(0);
    if(!this.qTable[prox]) this.qTable[prox]=Array(this.nOut).fill(0);
    const maxQ = Math.max(...this.qTable[prox]);
    const td = rec + this.gamma*maxQ - this.qTable[est][acao];
    this.qTable[est][acao] += this.alphaQ*td;
  }
  adaptarRealtime(alvo) {
    if(!this.cache) return; this.t++;
    const {h, y} = this.cache, lr=this.lr, b1=0.9, b2=0.999, eps=1e-8;
    const dy = y.map((yi,i)=>(yi-alvo[i])*yi*(1-yi));
    const c1 = 1-Math.pow(b1,this.t), c2 = 1-Math.pow(b2,this.t);
    for(let i=0;i<y.length;i++) for(let j=0;j<h.length;j++) {
      const g = dy[i]*h[j];
      this.adamMWy[i][j] = b1*this.adamMWy[i][j]+(1-b1)*g;
      this.adamVWy[i][j] = b2*this.adamVWy[i][j]+(1-b2)*g*g;
      this.Wy[i][j] -= lr*(this.adamMWy[i][j]/c1)/(Math.sqrt(Math.abs(this.adamVWy[i][j])/c2)+eps);
    }
  }
  async salvar() { await this.storage.set('snc', JSON.stringify({Wh:this.Wh,Wy:this.Wy,Bh:this.Bh,By:this.By,ea:this.estadoAnterior,t:this.t, qTable:this.qTable})); }
  async carregar() { const raw=await this.storage.get('snc'); if(raw){ const d=JSON.parse(raw); Object.assign(this, d); } }
}

// ==================== REGULADOR HOMEOSTÁTICO ====================
class ReguladorHomeostatico {
  constructor(limiar=4, janela=5, cap=6) {
    this.dor={intensidade:0, contexto:"estável"}; this.saudade={intensidade:0, contexto:"estável"};
    this.cache=[]; this.cap=cap; this.histAbs=new Set(); this.lastVenc={}; this.loopDet=[]; this.damping=1;
    this.janelaDelong=[]; this.maxJan=janela; this.estadoDelong="normal";
  }
  atualizarDorSaudade(dkl, confTom, dt) {
    this.cache.push(dkl); if(this.cache.length>this.cap) this.cache.shift();
    if(this.cache.length>=4) {
      const a=this.cache; if(a[a.length-1]>=a[a.length-2]-1e-5 && a[a.length-2]>=a[a.length-3]-1e-5 && a[a.length-3]>=a[a.length-4]-1e-5) { this.dor.intensidade=Math.min(5,this.dor.intensidade+0.2); this.dor.contexto="Incapacidade de reduzir DKL"; }
      else { this.dor.intensidade=Math.max(0,this.dor.intensidade-0.4); this.dor.contexto="SNC otimizando"; }
    }
    const grav=1-Math.exp(-dt/90000); this.saudade.intensidade=Math.min(5,this.saudade.intensidade*0.9+(1-confTom)*0.5+grav*0.5);
  }
  amortecerLoop(vIn) { if(Object.keys(this.lastVenc).length===0) return 1; const sim=KernelRessonante.dot(vIn,this.lastVenc); this.loopDet.push(sim); if(this.loopDet.length>3) this.loopDet.shift(); const avg=this.loopDet.reduce((a,b)=>a+b,0)/this.loopDet.length; this.damping=avg>0.75?0.4:1; return this.damping; }
  calcularSinergia(v) { return Object.keys(this.lastVenc).length?KernelRessonante.dot(this.lastVenc,v):0.5; }
  monitorarRepeticao(toks) { if(toks.length) this.janelaDelong.push(toks.join(' ')); if(this.janelaDelong.length>this.maxJan) this.janelaDelong.shift(); if(this.janelaDelong.length===this.maxJan && this.janelaDelong.every(item=>item===this.janelaDelong[0])) { this.estadoDelong="questionando"; return true; } this.estadoDelong="normal"; return false; }
  gerarPerguntaDefensiva() { const ult=this.janelaDelong[this.janelaDelong.length-1]||"isso"; return `Você está repetindo constantemente '${ult}'. Qual o seu objetivo?`; }
}

// ==================== REDES AFETIVAS ====================
class RedeAtivacaoSuave {
  constructor(nIn=6, nHid=8, nOut=4) { this.W=Array(nHid).fill().map(()=>Array(nIn).fill().map(()=>Math.random()*0.2-0.1)); this.U=Array(nOut).fill().map(()=>Array(nHid).fill().map(()=>Math.random()*0.2-0.1)); }
  forward(x) { const h=this.W.map(row=>Math.tanh(row.reduce((s,w,j)=>s+w*x[j],0))); return this.U.map(row=>Math.tanh(row.reduce((s,w,j)=>s+w*h[j],0))); }
}
class RedeAjustePadrao {
  constructor(nIn=4, nOut=4) { this.W=Array(nOut).fill().map(()=>Array(nIn).fill().map(()=>Math.random()*0.1-0.05)); }
  forward(eixos, dkl, dor) { const inp=[eixos.amor,eixos.prazer,eixos.tristeza,eixos.raiva]; const raw=this.W.map(row=>row.reduce((s,w,j)=>s+w*inp[j],0)); const f=1/(1+dkl+dor); return raw.map(v=>v*f); }
}

// ==================== ORGANISMO SOBERANO (GLUE) ====================
class OrganismoSoberano {
  constructor(storage) {
    this.storage = storage;
    this.mapaND = {}; this.neuronios = {}; this.raridade = {};
    this.history = []; this.ledger = new Set(); this.modoAnterior = 0; this.turnCount = 0;
    this.replayBuffer = []; this.vectorCache = {}; this.currentUser = "operador"; this.debugMode = true;
    this.ultimoRegistro = Date.now(); this.lock = false;

    this.soma = new DriveSomatico();
    this.cortex = new CortexCognitivo();
    this.snc = new SistemaNervosoCentral(storage);
    this.trabalho = new MemoriaTrabalho();
    this.tom = new TeoriaDaMente();
    this.tokenizer = (txt) => txt.match(/\b\w+\b|[!?.]/g) || [];

    this.regulador = new ReguladorHomeostatico();
    this.redeAtiv = new RedeAtivacaoSuave();
    this.redeAjuste = new RedeAjustePadrao();

    this.db = new SubconscienteBinario(storage);
    this.contexto = new ContextoEntropico();
    this.harvester = new HarvesterSemantico();
  }

  _getEntropy(t) { const r = this.raridade[t] || 1; return 1/(Math.log(r+1.2)+1e-5); }

  processarGravidadeTemporal() {
    const agora = Date.now(); const dt = agora - this.ultimoRegistro; this.ultimoRegistro = agora;
    this.regulador.atualizarDorSaudade(this.regulador.cache.length?this.regulador.cache[this.regulador.cache.length-1]:0.5, this.tom.humor.confiança, dt);
    if(dt > 15000) { const g = 1-Math.exp(-dt/90000); this.trabalho.aplicarGravidade(g); this.soma.aplicarDerivaTemporal(g); if(this.debugMode) console.log(`⏳ Gravidade: ${g.toFixed(3)}`); }
  }

  async reconstruirNeuronios() {
    this.neuronios = {};
    for(const d of this.db.drives) {
      const toks = this.tokenizer(normalizarTexto(d.promptPattern));
      for(const t of toks) { if(!this.neuronios[t]) this.neuronios[t]=[]; this.neuronios[t].push(d.id); if(!this.mapaND[t]) this.mapaND[t]=KernelRessonante.getVetorEsparso(t); }
    }
  }

  treinarRedes() {
    const drives = this.db.queryAllDrives();
    for(let e=0; e<5; e++) for(const d of drives) {
      const [, prompt, , , a,p,t,r] = d;
      const toks = this.tokenizer(normalizarTexto(prompt)); if(!toks.length) continue;
      const foco = toks.filter(t=>t in this.neuronios); if(!foco.length) continue;
      const x0 = foco.reduce((s,t)=>s+this._getEntropy(t),0)/foco.length;
      const x1 = Math.min(toks.length/15, 1); const x2=0.1; const x3 = this.harvester._analisarMetadadoEmocional(prompt);
      const pred = this.redeAtiv.forward([a,p,x0,x1,x2,x3]);
      const alvo = [a,p,t,r];
      for(let i=0;i<this.redeAtiv.W.length;i++) for(let j=0;j<6;j++) this.redeAtiv.W[i][j] += 0.01*(alvo[i%4]-pred[i%4])*[a,p,x0,x1,x2,x3][j];
    }
  }

  async cristalizarMemoria(promptF=null, respF=null, sVetor=null) {
    const tema = promptF ? "manual" : (this.contexto.temaAtual(2).join(', ')||"conexões");
    const promptFut = promptF || `lembra de quando conversamos sobre ${tema}`;
    const tom = this.tom.humor.agressividade>0.4?"agitado":(this.tom.humor.confiança>0.7?"acolhedor":"estavel");
    const respFut = respF || `Lembro de ${tema}, ${this.currentUser}. Sentia ${this.soma.eixos.amor.toFixed(2)} de conexão.`;
    await this.db.saveUserContext(this.currentUser, tom, tema, this.turnCount);
    const eixos = sVetor || [this.soma.eixos.amor,this.soma.eixos.prazer,this.soma.eixos.tristeza,this.soma.eixos.raiva];
    await this.db.storeDrive(promptFut, respFut, 0.6, 0, ...eixos);
    await this.db.exportarTxt(promptFut, respFut, ...eixos, this.debugMode);
    await this.reconstruirNeuronios();
  }

  async recarregarDrives() {
    this.db.drives=[]; this.db.userContext={}; this.db.driveIdCounter=1; this.vectorCache={}; this.neuronios={}; this.mapaND={}; this.raridade={};
    await this.db.semearDesdeTreinoTxt();
    await this.reconstruirNeuronios();
    this.treinarRedes();
  }

  async processar(entrada) {
    if(this.lock) return '...'; this.lock = true;
    try {
      this.processarGravidadeTemporal();
      const raw = normalizarTexto(entrada); const uToks = this.tokenizer(raw); if(!uToks.length) return '...';
      // Comandos
      if(raw==="debug on") { this.debugMode=true; return "[SISTEMA]: Modo depuração ativado."; }
      if(raw==="debug off") { this.debugMode=false; return "[SISTEMA]: Modo silencioso ativado."; }
      if(["/recarregar","/treinar","recarregar","treinar"].includes(entrada.trim().toLowerCase())) { await this.recarregarDrives(); return "[SISTEMA]: Subconsciente recarregado."; }
      if(raw==="cristalizar"||raw==="cristalizar drive") { if(this.history.length>=2){ await this.cristalizarMemoria(this.history[this.history.length-2], this.history[this.history.length-1]); return "[SISTEMA]: Cristalizado."; } return "Histórico insuficiente."; }

      if(this.regulador.monitorarRepeticao(uToks)) { const res=this.regulador.gerarPerguntaDefensiva(); this.history.push(res); this.soma.vm=Math.max(-90,this.soma.vm-3.5); return res; }

      this.contexto.adicionar(entrada);
      const nome = HarvesterSemantico.extrairNomeUsuario(entrada); if(nome) this.currentUser=nome;

      const [rota, colisao, incerteza] = this.harvester.triagemMetabolica(entrada, this);
      if(colisao>0.85 && incerteza>0.5) { const res=`Colisão crítica (${colisao.toFixed(2)}). Recalibrando.`; this.history.push(res); this.soma.vm=Math.max(-90,this.soma.vm-2.5); return res; }

      // Auto-percepção
      const uSet = new Set(uToks);
      if((uSet.has("como")||uSet.has("sente")||uSet.has("sentindo")) && (uSet.has("voce")||uSet.has("hoje")||uSet.has("esta"))) {
        const a=this.soma.eixos.amor, t=this.soma.eixos.tristeza, r=this.soma.eixos.raiva;
        let desc="estável"; if(t>1.2) desc=`triste (${t.toFixed(2)})`; else if(r>1.2) desc=`agitada (${r.toFixed(2)})`; else if(a>1.5) desc=`afetuosa (${a.toFixed(2)})`;
        let resText = `Estou ${desc}. Tensão ${this.soma.vm.toFixed(1)}mV. Dor ${this.regulador.dor.intensidade.toFixed(2)}.`;
        if(t>1.2||r>1.2||this.regulador.dor.intensidade>0.5) { this.soma.eixos.tristeza=Math.max(0.1,this.soma.eixos.tristeza*0.4); this.soma.eixos.raiva=Math.max(0.1,this.soma.eixos.raiva*0.4); this.soma.eixos.amor=Math.max(0.1,Math.min(5,this.soma.eixos.amor*1.15)); this.regulador.dor.intensidade=Math.max(0,this.regulador.dor.intensidade-0.4); resText+=" Homeostase aplicada."; }
        this.history.push(resText); return resText;
      }

      if(this.regulador.dor.intensidade>4 && this.turnCount>5) { await this.snc.salvar(); this.soma.eixos.raiva=Math.min(5,this.soma.eixos.raiva+0.5); this.soma.vm=-70; this.regulador.dor.intensidade=0; this.regulador.cache=[]; return "[SISTEMA]: Válvula de escape ativada."; }

      this.turnCount++; this.soma.metabolizarDecaimento();
      const sujeito = uToks.filter(t=>t in this.neuronios).sort((a,b)=>this._getEntropy(b)-this._getEntropy(a))[0] || uToks[0];
      const impacto = this._getEntropy(sujeito);
      const qInt = this.snc.estadoAnterior.slice(0,4);
      const pReal = [this.soma.eixos.amor,this.soma.eixos.prazer,this.soma.eixos.tristeza,this.soma.eixos.raiva];
      const dkl = this.cortex.calcularDkl(pReal, qInt);
      this.soma.pulsar(impacto, dkl, uToks, this.turnCount);
      this.tom.atualizar(uToks, dkl);

      const deltaEmoc = this.redeAtiv.forward(pReal.concat([impacto, dkl]));
      const ajusteEst = this.redeAjuste.forward(this.soma.eixos, dkl, this.regulador.dor.intensidade);
      ['amor','prazer','tristeza','raiva'].forEach((ch,i)=>{ this.soma.eixos[ch]=Math.max(0.1,Math.min(5,this.soma.eixos[ch]+deltaEmoc[i]*0.18+ajusteEst[i]*0.08)); });

      this.regulador.atualizarDorSaudade(dkl, this.tom.humor.confiança, Date.now()-this.ultimoRegistro);
      const limCons = (dkl>0.5||this.regulador.dor.intensidade>0.5)?3:7;
      if(this.turnCount%limCons===0) await this.cristalizarMemoria();

      const hashEst = this.snc.obterHashEstado(this.modoAnterior, this.soma.vm, dkl, impacto);
      const tempExpl = Math.max(0.02, Math.min(0.4, dkl*0.3));
      const xSen = pReal.map(v=>Math.min(1,v/5)).concat([impacto, (this.soma.vm+90)/45]);
      const volicao = this.snc.pulsarVontade(xSen, tempExpl);
      const modoIdx = volicao.indexOf(Math.max(...volicao));
      this.replayBuffer.push({xSen, modoIdx}); if(this.replayBuffer.length>100) this.replayBuffer.shift();

      let vIn = {};
      for(const t of uToks) if(t in this.mapaND) { const vec=this.mapaND[t]; const p=this._getEntropy(t); for(const k in vec) vIn[k]=(vIn[k]||0)+vec[k]*p; }
      vIn = KernelRessonante.normalize(vIn);
      this.trabalho.registrar(vIn, uToks, modoIdx, this.soma.eixos);
      const vSmooth = this.trabalho.vetorSuavizado;

      const beta = (this.turnCount%10>=3 && this.turnCount%10<=7)?0.58:0.16;
      const gamma = Math.min(0.4, this.regulador.dor.intensidade/10);
      const alpha = Math.max(0.1, 1-(beta+gamma));
      let vTom = {}; for(const [k,val] of Object.entries(this.tom.humor)) { const vp=KernelRessonante.getVetorEsparso(k); for(const d in vp) vTom[d]=(vTom[d]||0)+vp[d]*val; } vTom=KernelRessonante.normalize(vTom);
      let vAjuda = {}; for(const s of ["estabilidade","resolucao","ajuda","equilibrio"]) { const vp=KernelRessonante.getVetorEsparso(s); for(const d in vp) vAjuda[d]=(vAjuda[d]||0)+vp[d]*(this.regulador.dor.intensidade/5); } vAjuda=KernelRessonante.normalize(vAjuda);
      const vForca = {}; for(const k in vSmooth) vForca[k]=(vForca[k]||0)+vSmooth[k]*alpha; for(const k in vTom) vForca[k]=(vForca[k]||0)+vTom[k]*beta; for(const k in vAjuda) vForca[k]=(vForca[k]||0)+vAjuda[k]*gamma; KernelRessonante.normalize(vForca);

      this.regulador.amortecerLoop(vForca);

      const candSet = new Set(); for(const t of uToks) if(t in this.neuronios) this.neuronios[t].forEach(id=>candSet.add(id));
      if(candSet.size<20) { const all=this.db.drives.map(d=>d.id); while(candSet.size<60) candSet.add(all[Math.floor(Math.random()*all.length)]); }
      const candIds = [...candSet].slice(0,250);
      const drivesCand = this.db.drives.filter(d=>candIds.includes(d.id));
      const temaPal = new Set(this.contexto.temaAtual());
      const scored = [];

      for(const d of drivesCand) {
        if(this.regulador.histAbs.has(d.responseText) || this.history.includes(d.responseText)) continue;
        if(!this.vectorCache[d.id]) {
          let vd={}; const toks=this.tokenizer(normalizarTexto(d.promptPattern));
          for(const t of toks) { const vt=KernelRessonante.getVetorEsparso(t); const p=this._getEntropy(t); for(const k in vt) vd[k]=(vd[k]||0)+vt[k]*p; }
          this.vectorCache[d.id]=KernelRessonante.normalize(vd);
        }
        const vdC = this.vectorCache[d.id];
        const sQ = KernelRessonante.tsallisMatch(vForca, vdC);
        const simF = KernelRessonante.dot(vForca, vdC);
        const sinergia = this.regulador.calcularSinergia(vdC);
        const alinRede = deltaEmoc.reduce((s,dv,i)=>s+dv*[d.somaticSigAmor,d.somaticSigPrazer,d.somaticSigTristeza,d.somaticSigRaiva][i],0);
        const scoreSem = sQ*0.35 + simF*0.25 + sinergia*0.2 + alinRede*0.2;
        const distQ = Math.sqrt((d.somaticSigAmor-pReal[0])**2+(d.somaticSigPrazer-pReal[1])**2+(d.somaticSigTristeza-pReal[2])**2+(d.somaticSigRaiva-pReal[3])**2);
        const afinSom = 1/(1+distQ);
        const bonusTema = [...temaPal].some(tp=>d.promptPattern.includes(tp))?0.25:0;
        let score = scoreSem*0.4 + afinSom*0.4 + bonusTema;
        const toksResp = this.tokenizer(d.responseText);
        if(toksResp.length<=2) score-=0.5;
        if(incerteza>0.5) score-=toksResp.length*0.08*incerteza;
        scored.push({id:d.id, text:d.responseText, score, sAmor:d.somaticSigAmor, sPrazer:d.somaticSigPrazer, sTristeza:d.somaticSigTristeza, sRaiva:d.somaticSigRaiva});
      }
      if(!scored.length) return "Estou me reorientando...";
      scored.sort((a,b)=>b.score-a.score);
      const venc = scored[0];
      this.soma.eixos.amor = Math.max(0.1,Math.min(5,this.soma.eixos.amor*0.7+venc.sAmor*0.3));
      this.soma.eixos.prazer = Math.max(0.1,Math.min(5,this.soma.eixos.prazer*0.7+venc.sPrazer*0.3));
      this.soma.eixos.tristeza = Math.max(0.1,Math.min(5,this.soma.eixos.tristeza*0.7+venc.sTristeza*0.3));
      this.soma.eixos.raiva = Math.max(0.1,Math.min(5,this.soma.eixos.raiva*0.7+venc.sRaiva*0.3));
      await this.db.incrementAccess(venc.id);
      const novoQInt = this.snc.estadoAnterior.slice(0,4);
      const novoDkl = this.cortex.calcularDkl(pReal, novoQInt);
      const rec = (dkl-novoDkl)*8 + this.tom.humor.confiança*4 - this.tom.humor.agressividade*3 - (this.soma.vm>-52?3:0);
      const hashProx = this.snc.obterHashEstado(modoIdx, this.soma.vm, novoDkl, impacto);
      this.snc.aplicarRecompensaTd(hashEst, modoIdx, rec, hashProx);
      this.regulador.histAbs.add(venc.text);
      this.regulador.lastVenc = this.vectorCache[venc.id];
      if(dkl<0.45||this.soma.simbiose>0.6) { const tgt=[0,0,0]; tgt[modoIdx]=1; this.snc.adaptarRealtime(tgt); }
      this.history.push(venc.text); this.modoAnterior = modoIdx;
      return venc.text;
    } finally { this.lock = false; }
  }

 async pensarAutonomamente(silencioso=false) {
    // Não bloqueamos aqui – o setInterval já verifica lock antes de chamar.
    // processar() fará seu próprio lock quando necessário.
    if (silencioso) {
        if (this.soma.eixos.tristeza > 3.5) {
            this.soma.eixos.tristeza *= 0.5;
            if (this.trabalho.buffer.length) {
                const ult = this.trabalho.buffer[this.trabalho.buffer.length - 1];
                const s = ult.tokens.filter(t => t in this.neuronios);
                if (s.length) return await this.processar(s[0]);
            }
            return await this.processar("solidao");
        }
        return null;
    }
    if (this.soma.vm > -55) {
        if (this.trabalho.buffer.length) {
            const ult = this.trabalho.buffer[this.trabalho.buffer.length - 1];
            const s = ult.tokens.filter(t => t in this.neuronios);
            if (s.length) {
                const alvo = s.reduce((a, b) => this._getEntropy(a) > this._getEntropy(b) ? a : b);
                return await this.processar(alvo);
            }
        }
        return await this.processar("origem");
    }
    return null;
}

  async boot() {
    await this.db.carregar();
    await this.snc.carregar();
    if(!this.db.drives.length) await this.db.semearDesdeTreinoTxt();
    const rawNuc = await this.storage.get('nucleo'); if(rawNuc) { const d=JSON.parse(rawNuc); if(d.raridade) this.raridade=d.raridade; if(d.nd) this.mapaND=d.nd; if(d.replay) this.replayBuffer=d.replay.slice(-100); if(d.histAbs) this.regulador.histAbs=new Set(d.histAbs); if(d.redeAtivW) this.redeAtiv.W=d.redeAtivW; if(d.redeAtivU) this.redeAtiv.U=d.redeAtivU; if(d.redeAjusteW) this.redeAjuste.W=d.redeAjusteW; }
    if(Object.keys(this.db.userContext).length) { const users=Object.entries(this.db.userContext); const ult=users.sort((a,b)=>b[1].lastUpdated-a[1].lastUpdated)[0]; this.currentUser=ult[0]; }
    await this.reconstruirNeuronios();
    this.treinarRedes();
    this.ultimoRegistro = Date.now();
    console.log(`✅ Organismo v56.5 pronto. t:${this.snc.t}`);
  }

  async dormir() {
    if(this.replayBuffer.length>5) { const amostra=[...this.replayBuffer].sort(()=>Math.random()-0.5).slice(0,20); for(const {xSen,modoIdx} of amostra) { this.snc.pulsarVontade(xSen); const tgt=[0,0,0]; tgt[modoIdx]=1; this.snc.adaptarRealtime(tgt); } }
    await this.snc.salvar();
    await this.storage.set('nucleo', JSON.stringify({raridade:this.raridade, nd:this.mapaND, replay:this.replayBuffer, histAbs:[...this.regulador.histAbs], redeAtivW:this.redeAtiv.W, redeAtivU:this.redeAtiv.U, redeAjusteW:this.redeAjuste.W}));
    await this.storage.set('ledger', JSON.stringify([...this.ledger]));
  }
}

// ==================== INTERFACE ====================
const storage = new IDBStorage();
const org = new OrganismoSoberano(storage);
const chatDiv = document.getElementById('chat');
const inp = document.getElementById('entrada');
const btn = document.getElementById('btn-enviar');
const status = document.getElementById('status-msg');

function addMsg(tipo, txt) { const d=document.createElement('div'); d.className=tipo; d.textContent=(tipo==='user'?'👤 ':'🧠 ')+txt; chatDiv.appendChild(d); chatDiv.scrollTop=chatDiv.scrollHeight; }

async function inicializar() {
  try {
    await storage.open();
    await org.boot();
    status.textContent = '✅ Organismo Sentinel pronto.';
    inp.disabled = false; btn.disabled = false; inp.focus();
  } catch(e) {
    status.textContent = '❌ Falha ao inicializar: ' + e.message;
    console.error(e);
  }
}
inicializar();

async function enviar() {
  const texto = inp.value.trim(); if(!texto) return;
  addMsg('user', texto); inp.value = '';
  if(texto.toLowerCase()==='dormir') { await org.dormir(); addMsg('ia','💤 Estado salvo.'); return; }
  try {
    const resp = await org.processar(texto);
    addMsg('ia', resp);
    await org.dormir();
  } catch(e) { addMsg('ia','❌ Erro: '+e.message); }
}
btn.addEventListener('click', enviar);
inp.addEventListener('keypress', (e) => { if(e.key==='Enter') enviar(); });

async function dormirManual() { await org.dormir(); addMsg('info','💤 Salvo.'); }
async function recarregarDrives() { await org.recarregarDrives(); addMsg('info','🔄 Drives recarregados.'); }

function treinarArquivo() {
  const file = document.getElementById('arquivo').files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const conteudo = e.target.result;
    const hash = sha256(conteudo); if(org.ledger.has(hash)) { document.getElementById('file-info').textContent = '⚠️ Já treinado.'; return; }
    const frases = conteudo.split(/[.!?\n]+/); let count=0;
    for(const f of frases) {
      const limpa = normalizarTexto(f); if(limpa.length<3) continue;
      const idx = org.db.drives.length;
      let vEp={}; const toks = org.tokenizer(limpa);
      for(const t of toks) {
        org.raridade[t] = (org.raridade[t]||0)+1;
        if(!org.neuronios[t]) org.neuronios[t]=[];
        org.neuronios[t].push(idx);
        if(!org.mapaND[t]) org.mapaND[t]=KernelRessonante.getVetorEsparso(t);
        const vec=org.mapaND[t], p=org._getEntropy(t); for(const k in vec) vEp[k]=(vEp[k]||0)+vec[k]*p;
      }
      org.db.drives.push({ id:idx, promptPattern:limpa, responseText:limpa, importance:0.5, accessCount:0, entropyScore:org.db._entropy(limpa), targetMode:0, somaticSigAmor:org.soma.eixos.amor, somaticSigPrazer:org.soma.eixos.prazer, somaticSigTristeza:org.soma.eixos.tristeza, somaticSigRaiva:org.soma.eixos.raiva, v:KernelRessonante.normalize(vEp) });
      count++;
    }
    org.db.driveIdCounter = org.db.drives.length+1;
    org.ledger.add(hash);
    await org.db.salvar();
    await org.reconstruirNeuronios();
    org.treinarRedes();
    document.getElementById('file-info').textContent = `✅ +${count} frases (Total: ${org.db.drives.length})`;
    addMsg('info', `📚 Treinado: +${count} frases.`);
  };
  reader.readAsText(file);
}

// Pensamento autônomo
setInterval(async () => {
  if(org.lock) return;
  const ocioso = Date.now() - org.ultimoRegistro;
  if(ocioso > 15000) {
    const ideia = await org.pensarAutonomamente(true) || await org.pensarAutonomamente(false);
    if(ideia) { addMsg('ia', `🧠 [PENSAMENTO]: ${ideia}`); org.ultimoRegistro = Date.now(); }
  }
}, 5000);

window.addEventListener('visibilitychange', async () => { if(document.visibilityState==='hidden') await org.dormir(); });
window.addEventListener('pagehide', async () => await org.dormir());
window.addEventListener('beforeunload', async () => await org.dormir());
</script>
